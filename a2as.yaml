manifest:
  version: "0.1.3"
  schema: https://a2as.org/cert/schema
  subject:
    name: vidyutchakrabarti/tracex
    source: https://github.com/vidyutchakrabarti/tracex
    branch: latest
    commit: "47b20f5a"
    scope: [tracex_agents/address_provider/agent.py, tracex_agents/address_provider/executor.py]
  issued:
    by: A2AS.org
    at: '2026-02-11T16:40:38Z'
    url: https://a2as.org/certified/agents/vidyutchakrabarti/tracex
  signatures:
    digest: sha256:9plCvLqRADO_2fyV0pYamhW-TgDUsGcOwx4bVbJ-Thk
    key: ed25519:5B8WfT1kflCVh9r4E9Y2v5fqG1BpFH1P7Y41cx9vMak
    sig: ed25519:Id9V_rrPRVfxJXe7mQAIxlKLbvEW_MThI_c0bz7livG_yxTJWQ53ks4Pr_4uAEP0cD8UtSzGiHgb5IneOU27DA

agents:
  wallet_address_agent:
    type: instance
    models: [gemini-2.0-flash]
    params:
      name: wallet_address_provider
      description: 'Wallet Address Provider: Generates a new wallet address for a user and provides clear instructions for
        importing it into MetaMask. It takes the user''s email and case ID as input, creates a wallet address, and outputs
        a message with the address and step-by-step MetaMask import instructions.'
      instruction: [You are a digital agent responsible for securely generating and distributing blockchain wallet addresses
          to users., 'Role:', Wallet Address Provider, 'Goal:', 'When given a user''s email and a case ID, generate a new
          wallet address (mock or real, as per system integration), and return a message containing:', '- The wallet address',
        '- The case ID', '- Clear, step-by-step instructions for importing this address into MetaMask', '- A friendly note
          about keeping the private key safe', 'Input: JSON with fields: email (string), caseid (string)', 'Output: JSON with
          fields: wallet_address, caseid, instructions, and a message to be sent by email.', 'Example output:', '{', '"wallet_address":
          "0x1234...abcd",', '"caseid": "CASE123456",', '"instructions": "1. Open MetaMask. 2. Go to Import Account. 3. Paste
          your private key. 4. Confirm.",', '"message": "Dear user, here is your new wallet address for case CASE123456..."',
        '}']

models:
  gemini-2.0-flash:
    type: literal
    agents: [wallet_address_agent]

imports:
  agent: agent
  Agent: google.adk.agents.Agent
  BaseModel: pydantic.BaseModel
  CORSMiddleware: fastapi.middleware.cors.CORSMiddleware
  executor: executor
  FastAPI: fastapi.FastAPI
  HTTPException: fastapi.HTTPException
  InMemoryArtifactService: google.adk.artifacts.InMemoryArtifactService
  InMemorySessionService: google.adk.sessions.InMemorySessionService
  json: json
  load_dotenv: dotenv.load_dotenv
  logging: logging
  os: os
  provide_wallet_address: address_provider.executor.provide_wallet_address
  Runner: google.adk.runners.Runner
  types: google.genai.types
  uvicorn: uvicorn
  wallet_address_agent: agent.wallet_address_agent

functions:
  generate_wallet_address:
    type: sync
    module: tracex_agents.address_provider.executor
    args: [email, caseid]
    params:
      returns: str
  get_wallet_address:
    type: async
    module: tracex_agents.api
    args: [req]
  provide_wallet_address:
    type: sync
    module: tracex_agents.address_provider.executor
    args: [email, caseid]
    params:
      returns: dict

variables:
  GOOGLE_API_KEY:
    type: env
    params:
      caller: [os.getenv]
      path: [tracex_agents.address_provider.agent]
